[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-anvil"
version = "0.1.0"
description = "Agent-Anvil SDK: agent loop, event emission, and deterministic replay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent-Anvil Authors" }]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agent-anvil = "agent_anvil.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_anvil"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_anvil", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agent_anvil"]
